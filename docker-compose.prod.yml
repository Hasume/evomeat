services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nutrition_bot_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrition_bot}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - nutrition_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nutrition_bot_redis_prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - nutrition_network

  # Telegram Bot
  bot:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: nutrition_bot_prod
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    command: python bot/bot.py
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
    networks:
      - nutrition_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Web Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutrition_api_prod
    env_file:
      - .env.prod
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
    networks:
      - nutrition_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx (reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: nutrition_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: always
    networks:
      - nutrition_network

  # Prometheus (мониторинг)
  prometheus:
    image: prom/prometheus:latest
    container_name: nutrition_prometheus_prod
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: always
    networks:
      - nutrition_network

  # Grafana (визуализация метрик)
  grafana:
    image: grafana/grafana:latest
    container_name: nutrition_grafana_prod
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: always
    networks:
      - nutrition_network

volumes:
  postgres_data_prod:
  redis_data_prod:
  prometheus_data_prod:
  grafana_data_prod:

networks:
  nutrition_network:
    driver: bridge

