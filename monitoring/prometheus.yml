global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI метрики
  - job_name: 'nutrition-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  # Prometheus самомониторинг
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

